[project]
name = "capstone-development"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/shared", "services/agent", "services/business-mcp", "services/rag-mcp"]

[tool.uv.sources]
capstone-shared = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pyyaml>=6,<7",
  "pika>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Evaluation scoring lives with its runner in scripts/, outside the deployed services.
pythonpath = ["scripts"]
asyncio_mode = "auto"
