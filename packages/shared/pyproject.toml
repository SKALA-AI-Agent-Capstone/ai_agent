[project]
name = "capstone-shared"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "Pillow>=11,<13",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4,<6",
  "pytesseract>=0.3.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
